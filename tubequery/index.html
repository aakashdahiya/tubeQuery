<html>
  <head>
    <title>TubeQuery</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 20px;
        color: #333;
      }

      h1 {
        color: #d33;
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 5px 0 15px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
      }

      button {
        padding: 10px 24px;
        background: #d33;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
      }

      button:hover {
        background: #b22;
      }

      #answer-area {
        margin-top: 30px;
        padding: 20px;
        background: #f5f5f5;
        border-radius: 6px;
        min-height: 50px;
        line-height: 1.6;
      }

      #summary-area {
        margin-top: 30px;
      }

      .summary-section {
        margin-bottom: 30px;
      }

      .summary-section h2 {
        color: #d33;
        margin-bottom: 10px;
        font-size: 20px;
      }

      .concept-card {
        background: #f9f9f9;
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 10px;
        border-left: 3px solid #d33;
      }

      .concept-card strong {
        display: block;
        margin-bottom: 5px;
        color: #222;
      }

      .timestamp {
        color: #d33;
        font-size: 13px;
        font-weight: bold;
      }

      blockquote {
        border-left: 3px solid #ccc;
        padding-left: 15px;
        margin: 10px 0;
        color: #555;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>TubeQuery</h1>
    <h3>Ask any question from your favourite youtube video</h3>

    <div>
      <label for="video-url">Enter video url</label>
      <input
        id="video-url"
        type="text"
        placeholder="https://youtube.com/watch?v=ds...."
      />
    </div>

    <div>
      <label for="video-question">Enter your question</label>
      <input id="video-question" placeholder="How does it...." type="text" />
    </div>

    <button id="ask-button">Ask</button>

    <button id="summarize-button">Summarize</button>

    <div id="summary-area"></div>

    <div id="answer"></div>

    <script>
      const summarizeButton = document.getElementById("summarize-button");
      const summaryArea = document.getElementById("summary-area");
      const videoUrl = document.getElementById("video-url");
      const question = document.getElementById("video-question");
      const button = document.getElementById("ask-button");
      const answerArea = document.getElementById("answer");

      function renderSummary(summary) {
        return `
        <div class="summary-section">
            <h2>Overview</h2>
            <p>${summary.overview}</p>
        </div>
        
        <div class="summary-section">
            <h2>Key Concepts</h2>
            ${summary.key_concepts
              .map(
                (c) => `
                <div class="concept-card">
                    <strong>${c.concept} <span class="timestamp">(${c.timestamp})</span></strong>
                    <p>${c.explanation}</p>
                </div>
            `,
              )
              .join("")}
        </div>
        
        <div class="summary-section">
            <h2>Main Takeaways</h2>
            <ol>
                ${summary.main_takeaways.map((t) => `<li>${t}</li>`).join("")}
            </ol>
        </div>
        
        <div class="summary-section">
            <h2>Notable Quotes</h2>
            ${summary.notable_quotes
              .map(
                (q) => `
                <blockquote>
                    "${q.quote}"
                    <div class="timestamp">— at ${q.timestamp}</div>
                </blockquote>
            `,
              )
              .join("")}
        </div>
    `;
      }

      summarizeButton.addEventListener("click", async () => {
        const enteredValue = videoUrl.value;

        summaryArea.innerHTML = "Generating summary...";

        try {
          const response = await fetch("http://127.0.0.1:8000/summarize", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ video_url: enteredValue }),
          });

          if (!response.ok) {
            summaryArea.innerHTML = "Sorry, something went wrong. Try again.";
            return;
          }

          const data = await response.json();
          summaryArea.innerHTML = renderSummary(data.summary);
        } catch (error) {
          console.error(error);
          summaryArea.innerHTML = "Something went wrong. Check console.";
        }
      });

      button.addEventListener("click", async () => {
        const enteredValue = videoUrl.value;
        const enteredQuestion = question.value;

        //show loading status
        answerArea.innerHTML = "Thinking";
        try {
          const response = await fetch("http://127.0.0.1:8000/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              video_url: enteredValue,
              question: enteredQuestion,
            }),
          });

          if (!response.ok) {
            answerArea.innerHTML = "Sorry, something went wrong. Try again.";
            return;
          }

          const data = await response.json();
          answerArea.innerHTML = data.answer;
        } catch (error) {
          answerArea.innerHTML = "Could not reach the server. Is it running?";
        }
      });
    </script>
  </body>
</html>
